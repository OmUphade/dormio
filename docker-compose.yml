# Local development infrastructure for Dormio (all free / open source)
# Start:  docker compose up -d            (core)
#         docker compose --profile ai up -d     (adds Ollama)
#         docker compose --profile cctv up -d   (adds go2rtc for CCTV testing)
services:
  postgres:
    build: ./infra/postgres
    container_name: dormio-postgres
    environment:
      POSTGRES_USER: dormio
      POSTGRES_PASSWORD: dormio_dev_password
      POSTGRES_DB: dormio
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dormio -d dormio"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    container_name: dormio-valkey
    ports: ["6379:6379"]
    volumes: ["valkeydata:/data"]

  minio:
    image: minio/minio:latest
    container_name: dormio-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dormio
      MINIO_ROOT_PASSWORD: dormio_dev_password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  mailpit:
    image: axllent/mailpit:latest
    container_name: dormio-mailpit
    ports: ["1025:1025", "8025:8025"]

  ollama:
    image: ollama/ollama:latest
    container_name: dormio-ollama
    profiles: ["ai"]
    ports: ["11434:11434"]
    volumes: ["ollamadata:/root/.ollama"]

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: dormio-go2rtc
    profiles: ["cctv"]
    ports: ["1984:1984", "8555:8555"]
    volumes: ["./infra/go2rtc/go2rtc.yaml:/config/go2rtc.yaml"]

volumes:
  pgdata:
  valkeydata:
  miniodata:
  ollamadata:
